<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Weather — your day, outside</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #202b38;
        background: #f4f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --muted: #7d8997;
        --line: #e9edf1;
        --blue: #4777ed;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
      }
      button {
        font: inherit;
      }

      .page {
        width: min(100% - 48px, 1080px);
        margin: 0 auto;
        padding: 30px 0 44px;
      }

      .topbar,
      .brand,
      .updated,
      .section-heading,
      .weather-heading,
      .location,
      .refresh {
        display: flex;
        align-items: center;
      }

      .topbar {
        justify-content: space-between;
        margin-bottom: 62px;
      }
      .brand {
        gap: 11px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        color: white;
        background: #202b38;
      }
      .brand-mark svg {
        width: 19px;
        height: 19px;
      }
      .updated {
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4db98a;
      }

      main {
        max-width: 820px;
        margin: 0 auto;
      }
      .eyebrow {
        margin: 0 0 11px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 6vw, 54px);
        line-height: 1.08;
        letter-spacing: -0.055em;
      }
      .intro {
        margin: 13px 0 30px;
        color: var(--muted);
        font-size: 15px;
      }

      .weather-card {
        position: relative;
        overflow: hidden;
        min-height: 310px;
        padding: 34px 38px;
        border: 1px solid #e8ecf1;
        border-radius: 22px;
        background: linear-gradient(125deg, #fff 12%, #f8faff 100%);
        box-shadow: 0 18px 55px rgb(39 57 79 / 6%);
      }
      .weather-card::after {
        position: absolute;
        right: -72px;
        bottom: -176px;
        width: 390px;
        height: 390px;
        border: 1px solid rgb(71 119 237 / 7%);
        border-radius: 50%;
        box-shadow:
          0 0 0 34px rgb(71 119 237 / 3%),
          0 0 0 70px rgb(71 119 237 / 2%);
        content: "";
        pointer-events: none;
      }
      .weather-heading {
        justify-content: space-between;
      }
      .location {
        gap: 8px;
        color: #687687;
        font-size: 13px;
        font-weight: 600;
      }
      .location svg {
        width: 16px;
        height: 16px;
        color: var(--blue);
      }
      .date {
        margin-top: 5px;
        color: #9aa4af;
        font-size: 12px;
      }
      .weather-symbol {
        width: 67px;
        height: 67px;
        margin-right: 20px;
        color: #f1b83c;
      }
      .temperature-row {
        display: flex;
        align-items: flex-start;
        margin-top: 13px;
      }
      .temperature {
        font-size: clamp(82px, 16vw, 126px);
        line-height: 0.95;
        font-weight: 300;
        letter-spacing: -0.09em;
      }
      .degree {
        padding: 11px 0 0 7px;
        font-size: 33px;
        font-weight: 300;
      }
      .condition {
        margin: 12px 0 0 4px;
        color: #778494;
        font-size: 17px;
        font-weight: 500;
      }

      .section-heading {
        justify-content: space-between;
        margin: 34px 0 14px;
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .refresh {
        gap: 7px;
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: #6c7886;
        background: white;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s,
          transform 0.15s;
      }
      .refresh:hover {
        border-color: #cbd7ed;
        color: var(--blue);
      }
      .refresh:active {
        transform: scale(0.97);
      }
      .refresh svg {
        width: 13px;
        height: 13px;
      }
      .refresh:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: white;
      }
      .detail {
        min-height: 96px;
        padding: 19px 21px;
      }
      .detail + .detail {
        border-left: 1px solid var(--line);
      }
      .detail-label {
        color: #9aa4af;
        font-size: 11px;
      }
      .detail-value {
        margin-top: 9px;
        color: #364352;
        font-size: 14px;
        font-weight: 650;
      }
      .error {
        min-height: 20px;
        margin: 13px 2px 0;
        color: #b34848;
        font-size: 12px;
      }

      @media (max-width: 600px) {
        .page {
          width: min(100% - 32px, 1080px);
          padding-top: 20px;
        }
        .topbar {
          margin-bottom: 48px;
        }
        .updated {
          font-size: 11px;
        }
        .weather-card {
          min-height: 275px;
          padding: 27px 24px;
        }
        .weather-symbol {
          width: 52px;
          height: 52px;
          margin-right: 2px;
        }
        .detail {
          padding: 16px 13px;
        }
        .detail-value {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <circle
                cx="12"
                cy="12"
                r="4"
                stroke="currentColor"
                stroke-width="1.8"
              />
            </svg>
          </span>
          <span>daylight</span>
        </div>
        <div class="updated">
          <span class="live-dot"></span
          ><span id="updated">Connecting to your forecast</span>
        </div>
      </header>

      <main>
        <p class="eyebrow">Your local forecast</p>
        <h1>
          A little more<br />in tune with today. Ayyyyy. AYYY 2, AYYY 3, AYYY 4, AYY 8
        </h1>
        <p class="intro">The weather, right where you are.</p>

        <section class="weather-card" aria-label="Current weather">
          <div class="weather-heading">
            <div>
              <div class="location">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                  <circle
                    cx="12"
                    cy="10"
                    r="2.3"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                </svg>
                <span id="city">Loading location</span>
              </div>
              <div class="date" id="date"></div>
            </div>
            <svg
              class="weather-symbol"
              viewBox="0 0 72 72"
              fill="none"
              aria-hidden="true"
            >
              <circle cx="36" cy="36" r="12" fill="currentColor" />
              <g stroke="currentColor" stroke-linecap="round" stroke-width="3">
                <path
                  d="M36 5v8M36 59v8M5 36h8m46 0h8M14.1 14.1l5.7 5.7m32.4 32.4 5.7 5.7m0-43.8-5.7 5.7m-32.4 32.4-5.7 5.7"
                />
              </g>
            </svg>
          </div>
          <div class="temperature-row">
            <span class="temperature" id="temperature">--</span>
            <span class="degree">°</span>
          </div>
          <p class="condition" id="condition">Fetching conditions…</p>
        </section>

        <div class="section-heading">
          <h2>At a glance</h2>
          <button class="refresh" id="refresh" type="button">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path
                d="M13.2 6A5.4 5.4 0 0 0 3.4 4.2L2.2 5.5M2.2 5.5V2.8m0 2.7h2.7m-2.1 3.5a5.4 5.4 0 0 0 9.8 1.8l1.2-1.3m0 0v2.7m0-2.7h-2.7"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Refresh
          </button>
        </div>
        <section class="details" aria-label="Weather details">
          <div class="detail">
            <div class="detail-label">Conditions</div>
            <div class="detail-value" id="detail-condition">—</div>
          </div>
          <div class="detail">
            <div class="detail-label">Temperature</div>
            <div class="detail-value" id="detail-temperature">—</div>
          </div>
          <div class="detail">
            <div class="detail-label">Updated</div>
            <div class="detail-value" id="detail-updated">—</div>
          </div>
        </section>
        <p class="error" id="error" role="status" aria-live="polite"></p>
      </main>
    </div>

    <script>
      const dateFormatter = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric",
      });
      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
      });

      document.getElementById("date").textContent = dateFormatter.format(
        new Date(),
      );

      async function loadWeather() {
        const button = document.getElementById("refresh");
        const error = document.getElementById("error");
        button.disabled = true;
        error.textContent = "";

        try {
          const response = await fetch("/weather", {
            headers: { Accept: "application/json" },
          });
          if (!response.ok) {
            throw new Error(`Weather request failed (${response.status}).`);
          }

          const weather = await response.json();
          if (
            typeof weather.city !== "string" ||
            typeof weather.temperature !== "number" ||
            typeof weather.condition !== "string"
          ) {
            throw new Error("The weather response is missing expected data.");
          }

          const updatedAt = timeFormatter.format(new Date());
          document.getElementById("city").textContent = weather.city;
          document.getElementById("temperature").textContent =
            weather.temperature;
          document.getElementById("condition").textContent = weather.condition;
          document.getElementById("detail-condition").textContent =
            weather.condition;
          document.getElementById("detail-temperature").textContent =
            `${weather.temperature}°`;
          document.getElementById("detail-updated").textContent = updatedAt;
          document.getElementById("updated").textContent =
            `Updated at ${updatedAt}`;
        } catch (cause) {
          error.textContent =
            cause instanceof Error
              ? cause.message
              : "Unable to load the weather right now.";
          document.getElementById("condition").textContent =
            "Forecast unavailable";
          document.getElementById("updated").textContent = "Unable to connect";
        } finally {
          button.disabled = false;
        }
      }

      document.getElementById("refresh").addEventListener("click", loadWeather);
      loadWeather();
    </script>
  </body>
</html>
